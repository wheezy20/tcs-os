<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admissions Offer</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --border: #d9dce1;
    --text: #1f2430;
    --text-muted: #6b7280;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --error: #dc2626;
    --error-bg: #fef2f2;
    --success: #15803d;
    --success-bg: #f0fdf4;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2.5rem 1rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }

  main {
    width: 100%;
    max-width: 480px;
  }

  h1 {
    font-size: 1.5rem;
    margin-bottom: 0.25rem;
  }

  .subtitle {
    color: var(--text-muted);
    margin-top: 0;
    margin-bottom: 1.75rem;
    font-size: 0.95rem;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
    text-align: center;
  }

  .button-row {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }

  button {
    flex: 1;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid var(--border);
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  #accept-btn {
    color: #fff;
    background: var(--primary);
    border-color: var(--primary);
  }

  #accept-btn:hover:not(:disabled) {
    background: var(--primary-hover);
  }

  #decline-btn {
    background: #fff;
    color: var(--text);
  }

  .message {
    display: none;
    margin-top: 1.25rem;
    padding: 0.85rem 1rem;
    border-radius: 6px;
    font-size: 0.9rem;
    line-height: 1.4;
    text-align: left;
  }

  .message.visible {
    display: block;
  }

  .message.success {
    background: var(--success-bg);
    color: var(--success);
    border: 1px solid #bbf7d0;
  }

  .message.error {
    background: var(--error-bg);
    color: var(--error);
    border: 1px solid #fecaca;
  }
</style>
</head>
<body>
<main>
  <h1>Your Admissions Offer</h1>
  <p class="subtitle">Please let us know whether you'd like to accept this offer.</p>

  <div class="card">
    <div id="pre-response">
      <p>Click below to respond to this offer.</p>
      <div class="button-row">
        <button type="button" id="accept-btn">Accept</button>
        <button type="button" id="decline-btn">Decline</button>
      </div>
    </div>
    <div id="form-message" class="message" role="status" aria-live="polite"></div>
  </div>
</main>

<script>
  const API_BASE = "http://127.0.0.1:8000/api/admissions";
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  const preResponse = document.getElementById("pre-response");
  const messageBox = document.getElementById("form-message");
  const acceptBtn = document.getElementById("accept-btn");
  const declineBtn = document.getElementById("decline-btn");

  function showMessage(text, type) {
    messageBox.textContent = text;
    messageBox.className = `message visible ${type}`;
  }

  if (!token) {
    preResponse.hidden = true;
    showMessage("This link is missing its offer reference. Please use the link from your offer email.", "error");
  }

  async function respond(response) {
    acceptBtn.disabled = true;
    declineBtn.disabled = true;

    try {
      const resp = await fetch(`${API_BASE}/offers/${encodeURIComponent(token)}/respond/`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ response }),
      });

      const data = await resp.json().catch(() => ({}));

      if (resp.ok) {
        preResponse.hidden = true;
        const verb = data.response === "accepted" ? "accepted" : "declined";
        showMessage(
          `Thank you — you've ${verb} the offer for ${data.student_full_name}. `
          + "Our admissions team has been notified.",
          "success"
        );
      } else {
        showMessage(data.detail || "Something went wrong. Please try again or contact admissions.", "error");
        acceptBtn.disabled = false;
        declineBtn.disabled = false;
      }
    } catch (err) {
      showMessage("Could not reach the server. Please check your connection and try again.", "error");
      acceptBtn.disabled = false;
      declineBtn.disabled = false;
    }
  }

  acceptBtn.addEventListener("click", () => respond("accepted"));
  declineBtn.addEventListener("click", () => respond("declined"));
</script>
</body>
</html>
