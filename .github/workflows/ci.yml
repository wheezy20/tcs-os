name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # These are CI-only dummy values, not real secrets — settings.py needs
    # SOME value for SECRET_KEY/DATABASE_URL to import at all (see
    # docs/deployment.md's Dockerfile note on the same requirement at
    # build time). DATABASE_URL uses in-memory SQLite, matching how the
    # admissions test suite is already run locally (Supabase's pooler
    # can't CREATE DATABASE for Django's default test runner). Real
    # secrets stay in Secret Manager / gcloud, never here.
    env:
      SECRET_KEY: ci-only-dummy-key-not-for-production-use
      DATABASE_URL: "sqlite://:memory:"
      DEBUG: "False"
      GCP_PROJECT_ID: ""

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Confirm no missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        working-directory: backend
        run: python manage.py test
