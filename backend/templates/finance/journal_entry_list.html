{% extends "finance/base.html" %}
{% block title %}Journal Entries{% endblock %}
{% block content %}
<h2 class="font-heading text-2xl text-primary mb-6">Journal Entries</h2>

<table class="w-full text-sm bg-white border border-brandborder rounded-lg overflow-hidden">
  <thead>
    <tr class="text-left text-gray-500 border-b border-brandborder bg-brandbg">
      <th class="py-2 px-3">ID</th><th class="px-3">Date</th><th class="px-3">Campus</th><th class="px-3">Description</th>
    </tr>
  </thead>
  <tbody>
    {% for entry in entries %}
    <tr class="border-b border-brandborder">
      <td class="py-2 px-3"><a href="{% url 'finance:journal-entry-detail' entry.pk %}" class="text-primary underline">{{ entry.id }}</a></td>
      <td class="px-3">{{ entry.entry_date }}</td>
      <td class="px-3">{{ entry.campus }}</td>
      <td class="px-3">{{ entry.description }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
